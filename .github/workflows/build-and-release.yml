name: Build and Auto-Release Mistus Copy Pasta

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Installer & Release
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Inno Setup Compiler
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Extract Application Version
        id: get_version
        run: |
          $ver = python -c "from app.version import APP_VERSION; print(APP_VERSION)"
          echo "APP_VERSION=$ver" >> $env:GITHUB_ENV
          echo "Detected version: $ver"

      - name: Build Standalone Binaries with PyInstaller
        run: |
          python -m PyInstaller CopyPasta.spec --noconfirm

      - name: Compile Windows Setup Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ env.APP_VERSION }} installer.iss

      - name: Upload Unsigned Installer as Artifact
        id: upload_unsigned_installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-v${{ env.APP_VERSION }}
          path: Mistus_Copy_Pasta_Setup_*.exe
          if-no-files-found: error

      - name: Submit Signing Request to SignPath
        id: signpath_request
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'copypastapro' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload_unsigned_installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: 'signed-output'

      - name: Replace with Signed Installer
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          if (Test-Path "signed-output") {
            Get-ChildItem -Path signed-output\*.exe | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination . -Force
              Write-Host "Replaced installer with signed binary: $($_.Name)"
            }
          }

      - name: Publish GitHub Release with Installer
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "Mistus Copy Pasta v${{ env.APP_VERSION }}"
          body_path: RELEASE_NOTES.md
          files: |
            Mistus_Copy_Pasta_Setup_*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
